name: CI
on: 
  push:
    branches: [main]
jobs:
  container-test-job:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/owner/image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)
